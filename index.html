<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Time Calculator</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <!-- 1. 标题字体已调小 -->
    <h1 style="font-size: 20px;">Time Calculator</h1>

    <input
        id="timeInput"
        placeholder="Start Time (850)"
        autofocus>

    <input
        id="minuteInput"
        type="number"
        placeholder="Minutes">

    <!-- 2. Result 已向上移至 Minutes 下方 -->
    <h2 id="result">
        Result:
    </h2>

    <div class="buttons">

        <button onclick="calculateTime('add')">
            + Add Minutes
        </button>

        <button onclick="calculateTime('subtract')">
            - Subtract Minutes
        </button>

        <button onclick="clearAll()">
            Clear
        </button>

    </div>

</div>

<script src="script.js"></script>

</body>

</html>
