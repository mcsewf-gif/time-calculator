<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Time Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <h1>Time Calculator</h1>
    <link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">

    <input
        id="timeInput"
        placeholder="Start Time (850)"
        autofocus>

    <input
        id="minuteInput"
        type="number"
        placeholder="Minutes">

    <div class="buttons">

        <button onclick="calculateTime('add')">
            + Add Minutes
        </button>

        <button onclick="calculateTime('subtract')">
            - Subtract Minutes
        </button>

        <button onclick="clearAll()">
            Clear
        </button>

    </div>

    <h2 id="result">
        Result:
    </h2>

</div>

<script src="script.js"></script>

</body>

</html>
